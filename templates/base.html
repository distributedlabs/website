<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#f4f1e8" />
        <meta
            name="description"
            content="{% block description %}{{ config.description }}{% endblock description %}"
        />
        <title>{% block title %}{{ config.title }} — Product engineering with taste{% endblock title %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap"
            rel="stylesheet"
        />
        <link rel="alternate" type="application/atom+xml" title="Distributed Labs blog" href="{{ get_url(path='atom.xml') | safe }}" />
        <script>document.documentElement.classList.add("js");</script>
        <link rel="stylesheet" href="{{ get_url(path='styles/site.css') | safe }}" />
        {% block head %}{% endblock head %}
    </head>
    <body class="{% block body_class %}{% endblock body_class %}">
        <header class="site-header{% block header_class %}{% endblock header_class %}">
            <nav class="nav shell" aria-label="Main navigation">
                <a class="brand" href="{{ get_url(path='/') | safe }}" aria-label="Distributed Labs home">
                    <span class="brand-mark" aria-hidden="true">D·L</span>
                    <span>Distributed Labs</span>
                </a>
                <div class="nav-links">
                    <a href="{{ get_url(path='projects') | safe }}">Projects</a>
                    <a href="{{ get_url(path='blog') | safe }}">Blog</a>
                    <a href="{{ get_url(path='/#expertise') | safe }}">Expertise</a>
                    <a href="{{ get_url(path='/#approach') | safe }}">Approach</a>
                </div>
                <a class="nav-cta" href="mailto:{{ config.extra.email }}">
                    <span>Start a project</span>
                    <svg aria-hidden="true" viewBox="0 0 16 16" fill="none">
                        <path d="M3 13 13 3M6 3h7v7" stroke="currentColor" stroke-width="1.5" />
                    </svg>
                </a>
            </nav>
        </header>

        <main id="top">
            {% block content %}{% endblock content %}
        </main>

        <footer>
            <div class="shell footer-inner">
                <a class="brand" href="{{ get_url(path='/') | safe }}">
                    <span class="brand-mark" aria-hidden="true">D·L</span>
                    <span>Distributed Labs</span>
                </a>
                <a href="mailto:{{ config.extra.email }}">{{ config.extra.email }}</a>
                <div class="footer-links">
                    <a href="{{ get_url(path='projects') | safe }}">Projects</a>
                    <a href="{{ get_url(path='blog') | safe }}">Blog</a>
                </div>
            </div>
        </footer>

        <script>
            if ("IntersectionObserver" in window) {
                const reveal = new IntersectionObserver(
                    (entries) => {
                        for (const entry of entries) {
                            if (entry.isIntersecting) {
                                entry.target.classList.add("visible");
                                reveal.unobserve(entry.target);
                            }
                        }
                    },
                    { threshold: 0.12 },
                );

                document.querySelectorAll(".reveal").forEach((element) => reveal.observe(element));
            } else {
                document.querySelectorAll(".reveal").forEach((element) => element.classList.add("visible"));
            }
        </script>
    </body>
</html>
